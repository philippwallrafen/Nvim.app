name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(cat VERSION)"

          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "Tag $TAG does not match VERSION ($VERSION)"
            exit 1
          fi

      - name: Validate launcher
        run: |
          /bin/sh -n src/terminal.sh
          /usr/bin/osacompile -o /tmp/terminal-chooser.scpt \
            -e 'on run' \
            -e 'set choices to paragraphs of (system attribute "NVIM_TERMINALS")' \
            -e 'set picked to choose from list choices with title "Nvim.app" with prompt "Choose a terminal for Nvim.app:"' \
            -e 'if picked is false then return ""' \
            -e 'return picked as text' \
            -e 'end run'

      - name: Build package
        run: |
          chmod +x ./nvim-app.sh
          ./nvim-app.sh package

      - name: Verify package
        shell: bash
        run: |
          codesign --verify --deep --strict dist/Nvim.app
          plutil -lint dist/Nvim.app/Contents/Info.plist

          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Nvim.app/Contents/Info.plist)"
          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dist/Nvim.app/Contents/Info.plist)"

          test "$APP_VERSION" = "$(cat VERSION)"
          test "$APP_ID" = "io.github.philippwallrafen.nvim-app"
          test -f dist/Nvim.app/Contents/Resources/terminal.sh
          test -f dist/Nvim.app.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ "$TAG" == "v0.3.1" ]]; then
            NOTES='Fixes the terminal chooser AppleScript used when multiple supported terminals are installed and adds a compile check in CI so chooser syntax errors are caught before release.'
            gh release create "$TAG" dist/Nvim.app.zip --title "Nvim.app $TAG" --notes "$NOTES"
          else
            gh release create "$TAG" dist/Nvim.app.zip --title "Nvim.app $TAG" --generate-notes
          fi

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(cat VERSION)"

          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "Tag $TAG does not match VERSION ($VERSION)"
            exit 1
          fi

      - name: Build package
        run: |
          chmod +x ./nvim-app.sh
          ./nvim-app.sh package

      - name: Verify package
        shell: bash
        run: |
          codesign --verify --deep --strict dist/Nvim.app
          plutil -lint dist/Nvim.app/Contents/Info.plist

          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Nvim.app/Contents/Info.plist)"

          test "$APP_VERSION" = "$(cat VERSION)"
          test -f dist/Nvim.app/Contents/Resources/iterm.applescript
          test -f dist/Nvim.app/Contents/Resources/terminal.applescript
          test -f dist/Nvim.app.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ "$TAG" == "v0.2" ]]; then
            NOTES='Nvim.app is now a macOS app wrapper for Neovim with optional iTerm2 integration. It supports Finder “Open With”, uses iTerm2 when available, falls back to Terminal.app, and no longer requires iTerm2 at build time.'
            gh release create "$TAG" dist/Nvim.app.zip --title "Nvim.app $TAG" --notes "$NOTES"
          else
            gh release create "$TAG" dist/Nvim.app.zip --title "Nvim.app $TAG" --generate-notes
          fi

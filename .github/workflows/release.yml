name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(cat VERSION)"

          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "Tag $TAG does not match VERSION ($VERSION)"
            exit 1
          fi

      - name: Build package
        run: |
          chmod +x ./nvim-app.sh
          ./nvim-app.sh package

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ "$TAG" == "v0.1.3" ]]; then
            NOTES='Adds Finder “Open With” support for text files. Nvim.app now registers as a macOS text editor and passes files opened from Finder or `open -a Nvim` to Neovim in iTerm2.'

            gh release create "$TAG" \
              dist/Nvim.app.zip \
              --title "Nvim.app $TAG" \
              --notes "$NOTES"
          else
            gh release create "$TAG" \
              dist/Nvim.app.zip \
              --title "Nvim.app $TAG" \
              --generate-notes
          fi

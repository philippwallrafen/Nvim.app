name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(cat VERSION)"

          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "Tag $TAG does not match VERSION ($VERSION)"
            exit 1
          fi

      - name: Validate launcher
        run: /bin/sh -n src/terminal.sh

      - name: Build package
        run: |
          chmod +x ./nvim-app.sh
          ./nvim-app.sh package

      - name: Verify package
        shell: bash
        run: |
          codesign --verify --deep --strict dist/Nvim.app
          plutil -lint dist/Nvim.app/Contents/Info.plist

          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Nvim.app/Contents/Info.plist)"
          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dist/Nvim.app/Contents/Info.plist)"

          test "$APP_VERSION" = "$(cat VERSION)"
          test "$APP_ID" = "io.github.philippwallrafen.nvim-app"
          test -f dist/Nvim.app/Contents/Resources/terminal.sh
          test -f dist/Nvim.app.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ "$TAG" == "v0.3" ]]; then
            NOTES='Adds Ghostty, iTerm2, Warp, Alacritty, and Terminal.app support. Nvim.app now prompts when multiple terminals are installed, remembers the selected terminal, and uses the new io.github.philippwallrafen.nvim-app bundle/settings identifier.'
            gh release create "$TAG" dist/Nvim.app.zip --title "Nvim.app $TAG" --notes "$NOTES"
          else
            gh release create "$TAG" dist/Nvim.app.zip --title "Nvim.app $TAG" --generate-notes
          fi
